# Stage 6 (RSNA): ResNet-50, chest radiograph weights (TorchXRayVision)
#
# Pretrained on chest radiographs. Note that this backbone imports torchxrayvision,
# which contains a package called 'model'; common/model.py must have been renamed to
# vae_model.py or the import collides.
#
# Inherits base_rsna.yaml, so data.module is rsna, lung masking is off (RSNA
# ships no segmentations) and pixel-level localisation against the annotation
# boxes is reported automatically for the Lung Opacity class.
#
#   cd stage6_resnet_cxr_rsna
#   python ../common/calibrate_perceptual_weight.py --config config.yaml   # FIRST
#   # put the recommended value in loss.perceptual.weight, then
#   qsub train_vae.aqua
#   qsub eval_vae.aqua

_base_: ../common/base_rsna.yaml

experiment:
  name: rsna_vae_resnet50_cxr

paths:
  output_root: "runs"

loss:
  perceptual:
    enabled: true
    backbone: resnet_cxr
    weights: resnet50-res512-all
    layers: [layer1, layer2, layer3, layer4]
    # PLACEHOLDER. Weights calibrated on the COVID-19 Radiography Database do
    # NOT carry over to RSNA: both the reconstruction term and the raw
    # perceptual term depend on the image statistics, and RSNA reconstructs
    # somewhat better (L1 0.0367 against 0.0428), so the ratio differs. The
    # backbone-to-backbone spread on COVID alone was already 24x, from 0.00046
    # to 0.01125. Calibrate per backbone AND per dataset.
    weight: 0.00046

training:
  batch_size: 32
