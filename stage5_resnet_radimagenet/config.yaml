# Stage 5: ResNet-50, RadImageNet weights
#
# The middle rung: medical imaging, but CT, MRI and ultrasound rather than
# radiographs. RadImageNet contains no X-rays at all, so 'medical' should not be
# read as 'near-domain'; the authors' own chest-radiography transfer is +1.9 percent
# AUC over ImageNet, their weakest result. Included because it completes the
# gradient, not because it is expected to win.
#
#   cd stage5_resnet_radimagenet
#   python ../common/calibrate_perceptual_weight.py --config config.yaml   # FIRST
#   # put the recommended value in loss.perceptual.weight, then
#   qsub train_vae.aqua
#   qsub eval_vae.aqua

_base_: ../common/base.yaml

experiment:
  name: vae_resnet50_radimagenet

paths:
  output_root: "runs"

loss:
  perceptual:
    enabled: true
    backbone: resnet50_radimagenet
    layers: [layer1, layer2, layer3, layer4]
    # Downloaded from the hub on first use and cached. Set checkpoint to a local
    # path to work offline or to pin a specific copy.
    checkpoint: null
    # PLACEHOLDER. The weight calibrated for one backbone does NOT transfer to
    # another: every network has its own activation scale. With VGG-19 the raw
    # perceptual term sat at 0.410 against a reconstruction term of 0.0039, a
    # 105x mismatch, and w = 0.5 put it at 98 percent of the objective, left the
    # KL term at 0.1 percent, disabled the information bottleneck and cost 0.08
    # to 0.10 AUROC. Run the calibration script and replace this value.
    weight: 0.00247

training:
  batch_size: 64
